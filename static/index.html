<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LABYRINTH OF TARTARUS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/static/style.css">
</head>

<body>

  <!-- BOOT SCREEN -->
<div id="bootScreen" class="screen">
  <div class="shadow-layer">
    <span class="shadow-person shadow-one"></span>
    <span class="shadow-person shadow-two"></span>
    <span class="shadow-person shadow-three"></span>
    <span class="shadow-person shadow-four"></span>
    <span class="shadow-person shadow-five"></span>
  </div>

  <h2>ΤΑΡΤΑΡΟΣ</h2>
  <p>LABYRINTH OF TARTARUS</p>
  <label class="player-name-label" for="playerName">
    WANDERER NAME
  </label>
  <input
    id="playerName"
    class="player-name-input"
    type="text"
    maxlength="32"
    autocomplete="nickname"
    placeholder="Unknown Wanderer"
  >
  <p>Press ENTER or tap DESCEND</p>
  <button id="startButton" class="start-button" type="button">
    DESCEND
  </button>
</div>

  <!-- GAME CONTAINER -->
  <div id="gameContainer" style="display:none;">
    <h1 class="game-title glow-title">LABYRINTH OF TARTARUS</h1>

    <div class="crt-wrapper">
      <canvas id="game" tabindex="0"></canvas>
      <div class="scanlines"></div>
    </div>

    <button
      id="mobileMapToggle"
      class="mobile-map-toggle"
      type="button"
      aria-pressed="true"
    >
      MAP ON
    </button>

    <div
      id="mobileControls"
      class="mobile-controls"
      aria-hidden="true"
    >
      <div
        id="moveJoystick"
        class="move-joystick"
        aria-label="Movement control"
      >
        <div
          id="moveJoystickKnob"
          class="move-joystick-knob"
        ></div>
      </div>

      <div
        id="lookZone"
        class="look-zone"
        aria-label="Look control"
      ></div>
    </div>

    <button
      id="deathDashboardButton"
      class="death-dashboard-button"
      type="button"
      aria-hidden="true"
    >
      VIEW EXECUTIVE DASHBOARD
    </button>

    <div class="controls">
      <label>
        BRIGHTNESS
        <input id="brightnessSlider" type="range" min="0.5" max="1.8" step="0.05" value="1">
      </label>

      <label>
        GAMMA
        <input id="gammaSlider" type="range" min="0.5" max="1.8" step="0.05" value="1">
      </label>

      <label>
        AUDIO
        <button id="audioToggle" class="audio-button" type="button">ON</button>
      </label>
    </div>
  </div>

  <script src="/static/game.js"></script>

</body>
</html>
